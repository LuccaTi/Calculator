<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <h1>Calculator</h1>
        <input class="calculator-input" type="text" placeholder="Input the operation">
        <div class="digits-and-operators">
            <button class="number">1</button><button class="number">2</button>
            <button class="number">3</button><button class="number">4</button>
            <button class="number">5</button><button class="number">6</button>
            <button class="number">7</button><button class="number">8</button>
            <button class="number">9</button><button class="number">0</button>
            <button class="operator">+</button><button class="operator">-</button>
            <button class="operator">*</button><button class="operator">/</button>
            <button class="operator">=</button><button class="calculator-button">Clear</button>
        </div>
    </div>
</body>

</html>
